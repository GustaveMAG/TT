        glows.push(g); glowsIn.push(gi); candles.push(tb.candle);
      });

      // the order slip « 38 », pinned on the cork (state of frame 9's last image)
      mk(world, "p10-slip", "",
        '<div class="p10-slip-micro">Bon de commande</div><div class="p10-slip-date">SAM. 14 · 08:00</div>' +
        '<div class="p10-slip-num">38</div><div class="p10-slip-micro">couverts</div>');
      // the waiter
      var waiter = mk(world, "p10-waiter", "", '<div class="p10-tray"></div>');
      // the Couvert card folded into a pill, flying to T12 (world centre 1100,1162 = screen 960,430 at t=0)
      var pill = mk(world, "p10-pill", "", "38");

      /* ---------- the single camera proxy (+ the flame clock), one writer ---------- */
      var C = { cx: 1100, cy: 1300, s: 0.8, blur: 10, dx: 0, fl: 0 };
      function render() {
        SALLE.cam(world, { cx: C.cx, cy: C.cy, s: C.s, blur: C.blur > 0.05 ? +C.blur.toFixed(2) : 0, dx: C.dx });
        for (var i = 0; i < glowsIn.length; i++) {
          var a = C.fl * 2 * Math.PI * 1.7 + i * 1.37;
          var v = 0.6 * Math.sin(a) + 0.4 * Math.sin(a * 2.3 + 0.7);
          glowsIn[i].style.transform = "scale(" + (1 + 0.07 * v).toFixed(4) + ")";
          glowsIn[i].style.opacity = (0.86 + 0.14 * v).toFixed(3);
        }
      }
      render();

      var tl = gsap.timeline({ paused: true, onUpdate: render });

      /* ===== camera track ===== */
      // 0.00 to 0.40: end of the pull-back onto the wide plan (expo.out), blur 10 -> 0
      tl.fromTo(C, { cx: 1100, cy: 1300, s: 0.8, blur: 10 }, { cx: 1640, cy: 960, s: 0.5, blur: 0, duration: 0.4, ease: "expo.out" }, 0);
      // 0.40 to 2.40: slow forward drift, down toward the cam(1640, 1080) framing
      tl.fromTo(C, { cy: 960, s: 0.5 }, { cy: 1035, s: 0.512, duration: 2.0, ease: "power2.in", immediateRender: false }, 0.4);
      // 2.40 on « pleine »: the gentle push, landing on cam(1640, 1080, 0.53) at 3.66 (T12 at screen 589, 593)
      tl.fromTo(C, { cy: 1035, s: 0.512 }, { cy: 1080, s: 0.53, duration: 1.26, ease: "power2.out", immediateRender: false }, 2.4);
      // 3.66 to 4.46: under the iris, 0.53 -> 0.535 (T12 stays at 586 to 589, 593)
      tl.fromTo(C, { s: 0.53 }, { s: 0.535, duration: 0.8, ease: "none", immediateRender: false }, 3.66);
      // flame clock (flicker of the lit candles), alive to 4.46
      tl.fromTo(C, { fl: 0 }, { fl: 2.96, duration: 2.96, ease: "none", immediateRender: false }, 1.5);

      /* ===== Scene 1 (0.00 to 1.33): COUVERT, the plan fills ===== */
      // 0.00 to 0.10: the pill lands on T12, then melts into the table
      tl.fromTo(pill, { x: 0, y: 0 }, { x: -160, y: 18, duration: 0.1, ease: "power2.out" }, 0);
      tl.fromTo(pill, { scale: 1, opacity: 1 }, { scale: 0.45, opacity: 0, duration: 0.14, ease: "power2.in", immediateRender: false }, 0.1);

      // 0.20 to 0.90: guests sit down, table after table from T12 outward (each disc x1.3 -> 1 in 0.1 s)
      order.forEach(function (id, r) {
        var t0 = 0.2 + r * 0.042;
        tables[id].guests.forEach(function (g, j) {
          var t = t0 + j * 0.012;
          tl.set(g, { opacity: 1 }, t);
          tl.fromTo(g, { scale: 1.3 }, { scale: 1, duration: 0.1, ease: "power3.out", immediateRender: false }, t);
        });
      });

      // 0.56 on « Couvert »: the wordmark lands letter by letter (x1.4 blurred -> sharp, 0.12 s, 0.03 s apart)
      var letters = byId("p10-wm").querySelectorAll(".p10-l");
      for (var k = 0; k < letters.length; k++) {
        var tk = 0.54 + k * 0.03;
        tl.fromTo(letters[k], { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, tk);
        tl.fromTo(letters[k], { scale: 1.4, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out", immediateRender: false }, tk);
      }

      // 0.90: the 14 « Confirmé » tags pulse together once
      tl.fromTo(tags, { scale: 1 }, { scale: 1.12, duration: 0.1, ease: "power2.out", immediateRender: false }, 0.9);
      tl.fromTo(tags, { scale: 1.12 }, { scale: 1, duration: 0.2, ease: "power2.inOut", immediateRender: false }, 1.0);

      // 1.30: the wordmark leaves upward (0.15 s) to make room for the sentence
      tl.fromTo(byId("p10-wm"), { y: 0, opacity: 1 }, { y: -40, opacity: 0, duration: 0.15, ease: "power3.in", immediateRender: false }, 1.3);

      /* ===== Scene 2 (1.33 to 3.71): « Ta salle, [pleine] {pour de vrai}. » ===== */
      // 1.50: every candle lights, nearest to farthest from T12 (0.04 s apart, glow x1.3 -> 1), the rhyme of 2.10 in frame 1
      order.forEach(function (id, r) {
        var t = 1.5 + r * 0.04;
        tl.fromTo(glows[r], { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.15, ease: "expo.out", immediateRender: false }, t);
        tl.fromTo(candles[r], { scale: 1.6 }, { scale: 1, duration: 0.15, ease: "expo.out", immediateRender: false }, t);
      });

      // 1.78: a waiter glides along the bottom of the room (still moving under the iris)
      tl.fromTo(waiter, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out", immediateRender: false }, 1.78);
      tl.fromTo(waiter, { x: 0 }, { x: 1100, duration: 2.68, ease: "none", immediateRender: false }, 1.78);

      // subtitle, word by word (grey 35 % then full ink)
      function word(el, t, boxed, ink) {
        if (boxed) {
          tl.fromTo(el, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out", immediateRender: false }, t);
          return;
        }
        tl.fromTo(el, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 0.35, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo(el, { opacity: 0.35 }, { opacity: 1, duration: ink || 0.2, ease: "power1.out", immediateRender: false }, t + 0.14);
      }
      word(byId("p10-w1"), 1.47);          // Ta 1.50
      word(byId("p10-w2"), 1.75);          // salle 1.78
      // key-word box traced from the left at 2.37, « pleine » 2.39 (cue 2.40)
      tl.fromTo(byId("p10-box"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 2.37);
      word(byId("p10-w3"), 2.39, true);    // pleine 2.40
      word(byId("p10-w4"), 2.62);          // pour 2.65
      word(byId("p10-w5"), 2.87);          // de 2.90
      word(byId("p10-w6"), 3.11, false, 0.05);   // vrai 3.14 (full ink before the 3.30 exit)
      word(byId("p10-w7"), 3.11, false, 0.05);   // .
      // 2.65 to 3.20: the peak stroke under « pour de vrai », drawn from the left (mask reveal, transforms only)
      tl.set(byId("p10-tr-o"), { opacity: 1 }, 2.65);
      tl.fromTo(byId("p10-tr-o"), { xPercent: -100 }, { xPercent: 0, duration: 0.55, ease: "sine.out", immediateRender: false }, 2.65);
      tl.fromTo(byId("p10-tr-i"), { xPercent: 100 }, { xPercent: 0, duration: 0.55, ease: "sine.out", immediateRender: false }, 2.65);
      // 3.30 to 3.44: the subtitle leaves
      tl.fromTo(byId("p10-sub"), { opacity: 1, y: 0 }, { opacity: 0, y: -8, duration: 0.14, ease: "power2.in", immediateRender: false }, 3.3);

      // 3.66: the iris of assemble.sh opens from the candle of T12 (screen 590, 595); the frame stays alive to 4.46

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
