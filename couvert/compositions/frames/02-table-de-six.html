      /* dérive arrière 1.6 → 1.55 de 2.85 à 4.20 */
      ft(cam, { s: 1.6 }, { s: 1.55, duration: 1.35, ease: "none" }, 2.85);
      /* 4.20 à 4.44 : filé vers la droite (accélération, +1800 u/s à la couture), flou 0 → 8 */
      var whipIn = function (p) { return Math.pow(p, 1.8); };
      ft(cam, { cx: 1560, cy: 800, s: 1.55 }, { cx: 1800, cy: 720, s: 1.2, duration: 0.24, ease: whipIn }, 4.2);
      ft(cam, { blur: 0 }, { blur: 8, duration: 0.21, ease: "power2.in" }, 4.2);

      /* profondeur de champ : les tables voisines de T7 se floutent (≈ 4 px écran) pendant le filé, se rendent nettes au départ */
      for (var id in tb) {
        if (+id === 7) continue;
        ft(tb[id].el, { filter: "blur(0px)" }, { filter: "blur(2.5px)", duration: 0.3, ease: "power2.inOut" }, 2.55);
        ft(tb[id].el, { filter: "blur(2.5px)" }, { filter: "blur(0px)", duration: 0.22, ease: "power2.in" }, 4.2);
      }

      /* flamme qui vacille : suite déterministe, finie, qui revient à 1 */
      function flicker(el, t0, t1, amp, seed) {
        var n = Math.floor((t1 - t0) / 0.1 + 1e-6), prev = 1;
        for (var i = 0; i < n; i++) {
          var v = i === n - 1 ? 1 : 1 + amp * (0.6 * Math.sin((i + seed) * 2.1) + 0.4 * Math.sin((i + seed) * 4.7));
          ft(el, { scale: prev }, { scale: v, duration: 0.1, ease: "sine.inOut" }, t0 + i * 0.1);
          prev = v;
        }
      }
      function haloBreath(el, t0, t1, seed) {
        var n = Math.floor((t1 - t0) / 0.2 + 1e-6), prev = 1;
        for (var i = 0; i < n; i++) {
          var v = i === n - 1 ? 1 : 0.9 + 0.1 * (0.5 + 0.5 * Math.sin((i + seed) * 1.7));
          ft(el, { opacity: prev }, { opacity: v, duration: 0.2, ease: "sine.inOut" }, t0 + i * 0.2);
          prev = v;
        }
      }

      /* ===== Scene 1 (0.00 à 2.55) : le gag de la serviette ===== */
      /* la serviette naît sous le flou du cran (après les 2 images de la couture) */
      ft(napWrap, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.07);
      /* 0.30 : « 20:47 » s'imprime, flou → net en 0.1 s */

      ft(clock, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.1, ease: "power3.out" }, 0.3);

      flicker(t12.candle, 0.5, 2.9, 0.07, 0);
      haloBreath(t12.halo, 0.5, 2.9, 0);

      /* la main : arrive (0.2 s expo.out, flou de bougé), tourne la serviette d'un quart de tour (0.1 s), repart (0.15 s power2.in) */
      var OFF = { x: 0.3746 * 300, y: -0.9272 * 300 };
      ft(arm, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 0.7);
      function waiter(t0, rotFrom, rotTo, armTwist) {
        ft(arm, { x: OFF.x, y: OFF.y, rotation: 0 }, { x: 0, y: 0, rotation: 0, duration: 0.2, ease: "expo.out" }, t0);
        ft(sleeve, { filter: "blur(5px)" }, { filter: "blur(2px)", duration: 0.2, ease: "expo.out" }, t0);
        ft(hand, { filter: "blur(2.4px)" }, { filter: "blur(0.6px)", duration: 0.2, ease: "expo.out" }, t0);
        ft(napWrap, { rotation: rotFrom }, { rotation: rotTo, duration: 0.1, ease: "power3.out" }, t0 + 0.2);
        ft(arm, { rotation: 0 }, { rotation: armTwist, duration: 0.1, ease: "power3.out" }, t0 + 0.2);
        ft(arm, { x: 0, y: 0, rotation: armTwist }, { x: OFF.x, y: OFF.y, rotation: 0, duration: 0.15, ease: "power2.in" }, t0 + 0.3);
        ft(sleeve, { filter: "blur(2px)" }, { filter: "blur(5px)", duration: 0.15, ease: "power2.in" }, t0 + 0.3);
        ft(hand, { filter: "blur(0.6px)" }, { filter: "blur(2.4px)", duration: 0.15, ease: "power2.in" }, t0 + 0.3);
      }
      waiter(0.7, 0, 90, 14);
      /* 1.20 : « 20:47 » → « 20:52 », les chiffres roulent */
      var tens = byId("p02-tens"), ones = byId("p02-ones");
      ft(tens, { y: 0 }, { y: -40, duration: 0.25, ease: "power3.out" }, 1.2);
      ft(ones, { y: 0 }, { y: -40, duration: 0.25, ease: "power3.out" }, 1.2);
      /* 1.50 : tenue, la flamme et un filet de fumée de la bougie */
      ft(smk12, { opacity: 0, y: 6, scaleY: 0.5 }, { opacity: 1, y: -8, scaleY: 1, duration: 0.45, ease: "power2.out" }, 1.5);
      ft(smk12, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in" }, 1.95);
      /* 1.80 : la main revient, identique, et remet la serviette dans l'autre sens (le gag) ; 2.10 elle repart */
      waiter(1.8, 90, 0, -14);
      /* la manche, hors champ, est retirée avant que le filé ne passe au-dessus d'elle */
      ft(arm, { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none" }, 2.3);
      /* 2.25 : « 20:58 » */
      ft(ones, { y: -40 }, { y: -80, duration: 0.25, ease: "power3.out" }, 2.25);

      /* ===== Scene 2 (2.55 à 4.44) : la table de six ne viendra pas ===== */
      /* l'heure s'efface dans le filé ; les chevalets qui tomberaient dans la bande du sous-titre (T12) et le numéro T7 aussi */
      ft(clock, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, 2.55);
      ft(t12.tent, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, 2.6);
      ft(t7num, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, 2.6);
      /* T7 : sa flamme vit pendant l'attente */
      flicker(t7.candle, 2.85, 3.6, 0.06, 3);
      haloBreath(t7.halo, 2.85, 3.65, 2);
      /* 3.25 sur « six » : le chevalet passe en braise */
      ft(tEmber, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.25);
      /* 3.64 sur « viendra » : la flamme se couche */
      ft(t7.candle, { scaleX: 1, scaleY: 1, x: 0 }, { scaleX: 1.5, scaleY: 0.5, x: 5, duration: 0.1, ease: "power2.out" }, 3.64);
      /* 3.80 : la bougie s'éteint (cœur → gris), halo 1 → 0 en 0.25 s, la nappe s'assombrit, le chevalet passe éteint */
      ft(t7.candle, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.out" }, 3.8);
      ft(t7.halo, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.out" }, 3.8);
      ft(t7.topoff, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.8);
      ft(tOff, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 3.8);
      ft(tEmber, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 3.8);
      /* 3.90 : un filet de fumée monte (0.6 s) ; il en reste un dernier filet à la couture */
      ft(smk7, { y: 14, scaleY: 0.35 }, { y: -18, scaleY: 1, duration: 0.6, ease: "power2.out" }, 3.9);
      ft(smk7, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 3.9);
      ft(smk7, { opacity: 1 }, { opacity: 0.6, duration: 0.32, ease: "none" }, 4.12);
      ft(smk7b, { y: 10, scaleY: 0.4 }, { y: -12, scaleY: 1, duration: 0.5, ease: "power2.out" }, 4.0);
      ft(smk7b, { opacity: 0 }, { opacity: 0.8, duration: 0.2, ease: "power2.out" }, 4.0);
      /* 4.02 sur « pas » : le chevalet « MARTIN ×6 » tombe à plat */
      ft(t7.tent, { scaleY: 1 }, { scaleY: 0.2, duration: 0.08, ease: "power2.in" }, 4.02);

      /* ---- sous-titre mot à mot : gris 35 %, y 8 → 0, flou 6 → 0 en 0.14 s, puis couleur pleine en 0.2 s ---- */
      var words = Array.prototype.slice.call(byId("p02-sub").getElementsByClassName("p02-w"));
      var CUES = [2.68, 2.87, 3.06, 3.25, 3.45, 3.64, 4.02];
      var LEAD = 0.03;
      words.forEach(function (el, i) {
        var t = CUES[i] - LEAD, inBox = i === 3;
        ft(el, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, t);
        ft(el, { color: inBox ? "rgba(245,239,228,0.35)" : "rgba(246,239,230,0.35)" },
          { color: inBox ? "#f5efe4" : "#f6efe6", duration: inBox ? 0.1 : 0.2, ease: "power1.inOut" }, t + (inBox ? 0.02 : 0.1));
      });
      /* boîte braise sous « six », tracée depuis la gauche, juste avant le mot */
      ft(byId("p02-boxbg"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out" }, 3.2);
      /* sortie du sous-titre, finie avant les 2 dernières images */
      ft(byId("p02-sub"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power2.in" }, 4.29);

      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
