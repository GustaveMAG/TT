      var toArr = function (list) { return Array.prototype.slice.call(list); };

      /* ---- le monde : plan clair, bougies allumées (petite lueur), ni chevalet ni étiquette ---- */
      var W = SALLE.build(byId("p06-salle"), { light: true });
      var world = W.world;

      var phone = byId("p06-phonewrap");
      var letters = toArr(phone.getElementsByClassName("p06-lt"));
      var micro = byId("p06-micro");
      var r1 = byId("p06-r1"), r2 = byId("p06-r2"), r3 = byId("p06-r3");
      var k1 = byId("p06-k1"), k2 = byId("p06-k2");
      var pill = byId("p06-pill"), pbgd = byId("p06-pbgd"), ptime = byId("p06-time"), plabel = byId("p06-plabel");
      var sub = byId("p06-sub"), box = byId("p06-box"), grain = byId("p06-grain");
      var w = [0, 1, 2, 3, 4, 5, 6, 7].map(function (i) { return byId("p06-w" + i); });

      var INK = "#1c1612", INK_GRAY = "rgba(28,22,18,0.35)";
      var PAPER = "#f5efe4", PAPER_GRAY = "rgba(245,239,228,0.35)";

      /* ---- caméra : UN proxy {cx, cy, s, blur, dx}, appliqué par SALLE.cam dans le seul onUpdate ;
         l'horloge de la pilule (minutes) est un proxy lu au même endroit ---- */
      var cam = { cx: 1300, cy: 1100, s: 0.62, blur: 12, dx: 0 };
      var clock = { m: 14 * 60 + 32 };
      var shown = "";

      function pad(n) { return (n < 10 ? "0" : "") + n; }
      function render() {
        SALLE.cam(world, cam);
        var m = Math.round(clock.m);
        var txt = pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);
        if (txt !== shown) { ptime.textContent = txt; shown = txt; }
      }

      var tl = gsap.timeline({ paused: true, defaults: { lazy: false }, onUpdate: render });

      /* ===== PISTE CAMÉRA ===== */
      /* 0.05 à 0.65 : sous le flash qui retombe, le fond passe de 12 à 6 px (le téléphone devient le seul plan net) */
      tl.fromTo(cam, { blur: 12 }, { blur: 6, duration: 0.6, ease: "power2.out", immediateRender: false }, 0.05);
      /* 0.30 à 2.95 : dérive latérale 15 u/s (le monde glisse vers la gauche, vers le plan large) */
      tl.fromTo(cam, { cx: 1300 }, { cx: 1300 + 15 * 2.65, duration: 2.65, ease: "none", immediateRender: false }, 0.3);
      /* 2.95 à 3.22 : recul vers le plan large, en accélération ; dernière image en plein mouvement */
      tl.fromTo(cam, { cx: 1300 + 15 * 2.65, cy: 1100, s: 0.62 }, { cx: 1470, cy: 1090, s: 0.58, duration: 0.27, ease: "power2.in", immediateRender: false }, 2.95);

      /* grain qui glisse d'un motif sur la séquence */
      tl.fromTo(grain, { x: 0 }, { x: -240, duration: T, ease: "none" }, 0);

      /* ===== 0.20 : le téléphone arrive de la droite, ×1,15, flou 8 → net (0,14 s expo.out) ===== */
      tl.fromTo(phone, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power1.out", immediateRender: false }, 0.2);
      tl.fromTo(phone, { x: 260, scale: 1.15, filter: "blur(8px)" }, { x: 0, scale: 1, filter: "blur(0px)", duration: 0.14, ease: "expo.out", immediateRender: false }, 0.2);
      /* tenue vivante : le téléphone glisse très lentement à gauche jusqu'au recul (−14 px) */
      tl.fromTo(phone, { y: 0 }, { y: -8, duration: 2.6, ease: "none", immediateRender: false }, 0.34);

      /* ===== 0.65 : sur « Couvert », le wordmark de l'appli s'imprime lettre à lettre ===== */
      letters.forEach(function (lt, i) {
        tl.fromTo(lt, { opacity: 0, y: 10, filter: "blur(4px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, 0.65 + i * 0.03);
      });
      tl.fromTo(micro, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, 0.3);

      /* ===== lignes de réservation : ×1,1 → 1 en 0,1 s, la coche suit ===== */
      function row(el, t, s0, s1) {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power1.out", immediateRender: false }, t);
        tl.fromTo(el, { scale: s0 }, { scale: s1, duration: 0.1, ease: "power3.out", immediateRender: false }, t);
      }
      function tick(el, t) {
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "expo.out", immediateRender: false }, t);
      }
      row(r1, 1.0, 1.1, 1);  tick(k1, 1.08);   /* 1.02 « prend » : Martin */
      row(r2, 1.36, 1.1, 1); tick(k2, 1.44);   /* 1.38 « réservations » : Bernard */
      row(r3, 2.72, 1.14, 1.04);               /* 2.74 « nuit » : Duval, encadré de braise */

      /* ===== 2.00 : la pilule « 14:32 » arrive à gauche ===== */
      tl.fromTo(pill, { opacity: 0, x: -50, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", immediateRender: false }, 2.0);
      /* 2.31, sur « jour » : l'heure roule jusqu'à 02:14 (0,4 s) en grandissant (comptage + échelle), la pilule passe au noir */
      tl.fromTo(clock, { m: 14 * 60 + 32 }, { m: 26 * 60 + 14, duration: 0.4, ease: "power2.out", immediateRender: false }, 2.31);
      tl.fromTo(ptime, { scale: 0.86 }, { scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 2.31);
      tl.fromTo(pbgd, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, 2.41);
      tl.fromTo(ptime, { color: INK }, { color: "#f6efe6", duration: 0.3, ease: "power2.inOut", immediateRender: false }, 2.41);
      tl.fromTo(plabel, { color: "#5c5348" }, { color: "#cfc1b3", duration: 0.3, ease: "power2.inOut", immediateRender: false }, 2.41);

      /* ===== 2.95 : départ du recul ; la pilule s'efface à gauche, le téléphone sort à droite (hors cadre avant la couture) ===== */
      tl.fromTo(pill, { opacity: 1, x: 0, filter: "blur(0px)" }, { opacity: 0, x: -140, filter: "blur(8px)", duration: 0.15, ease: "power2.in", immediateRender: false }, 2.95);
      tl.fromTo(phone, { x: 0, filter: "blur(0px)" }, { x: 889, filter: "blur(12px)", duration: 0.21, ease: "power2.in", immediateRender: false }, 2.95);

      /* ===== sous-titre mot par mot : gris (35 %), y 8, flou 6 → 0 en 0,14 s, puis pleine couleur en 0,2 s ===== */
      function word(el, t, gray, full, colorDelay, colorDur) {
        tl.fromTo(el, { opacity: 0, y: 8, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(el, { color: gray }, { color: full, duration: colorDur || 0.2, ease: "power1.inOut", immediateRender: false }, t + (colorDelay || 0.1));
      }
      word(w[0], 0.65, INK_GRAY, INK);   /* Couvert 0.67 */
      word(w[1], 1.0, INK_GRAY, INK);    /* prend 1.02 */
      word(w[2], 1.18, INK_GRAY, INK);   /* tes 1.20 */
      word(w[3], 1.36, INK_GRAY, INK);   /* réservations 1.38 */
      /* [boîte : jour et nuit] : la boîte braise se trace de la gauche en 0,16 s (2.29), les mots y arrivent en papier */
      tl.fromTo(box, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 2.27);
      word(w[4], 2.29, PAPER_GRAY, PAPER, 0.02, 0.1); /* jour 2.31 */
      word(w[5], 2.51, PAPER_GRAY, PAPER, 0.02, 0.1); /* et 2.53 */
      word(w[6], 2.72, PAPER_GRAY, PAPER, 0.02, 0.1); /* nuit 2.74 */
      word(w[7], 2.72, INK_GRAY, INK);                /* le point final, avec « nuit » */
      /* sortie du sous-titre, finie avant les deux dernières images */
      tl.fromTo(sub, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power2.in", immediateRender: false }, 3.06);

      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
