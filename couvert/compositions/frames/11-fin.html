  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "11-fin";
      var DUR = 4.52;
      var byId = function (id) {
        return document.getElementById(id);
      };
      var toArr = function (list) {
        return Array.prototype.slice.call(list);
      };
      var p3o = gsap.parseEase("power3.out");
      var p2o = gsap.parseEase("power2.out");
      var cl = function (v) {
        return v < 0 ? 0 : v > 1 ? 1 : v;
      };
      var seg = function (t, a, d) {
        return cl((t - a) / d);
      };

      var cam = byId("p11-cam");
      var cur = byId("p11-cur");
      var gr = byId("p11-gr");
      var iris = byId("p11-iris");
      var lastIris = "";
      var lastGrain = -1;

      /* the click: tip on "MOIS" (bottom of the press at 1.77, on the word "mois") */
      var CLICK = 1.77;
      /* one curved move from the bottom right (quadratic Bezier, 0.45 s power3.out), above the subtitle band */
      var C0 = [1985, 800];
      var C1 = [1430, 735];
      var C2 = [990, 588];
      var MOVE_AT = 1.22;
      var MOVE_DUR = 0.45;
      /* iris center: the button center (also the camera origin, so it never moves) */
      var IX = 960;
      var IY = 575;

      function irisR(t) {
        if (t < 2.6) return 9999;
        if (t < 4.0) return 1250 - 610 * ((t - 2.6) / 1.4);
        var d = t - 4.0;
        var r = 640 - 436 * d - 2190 * d * d;
        return r > 0 ? r : 0;
      }

      function render(t) {
        /* ---- camera: forward drift 1 -> 1.02 (Scene 1), 1.02 -> 1.05 (Scene 2) ---- */
        var s = t <= 2.12 ? 1 + 0.02 * (t / 2.12) : 1.02 + 0.03 * ((t - 2.12) / 2.4);
        cam.style.transform = "scale(" + s.toFixed(5) + ")";

        /* ---- cursor: one curve, direct click, then slides 20 px and fades ---- */
        var u = p3o(seg(t, MOVE_AT, MOVE_DUR));
        var a0 = (1 - u) * (1 - u);
        var a1 = 2 * (1 - u) * u;
        var a2 = u * u;
        var cx = a0 * C0[0] + a1 * C1[0] + a2 * C2[0];
        var cy = a0 * C0[1] + a1 * C1[1] + a2 * C2[1];
        var lv = p2o(seg(t, 2.4, 0.3));
        cx += 14 * lv;
        cy += 14 * lv;
        cur.style.transform = "translate(" + cx.toFixed(2) + "px," + cy.toFixed(2) + "px)";

        /* ---- grain: finite steps at 12 per second, offsets derived from the step index ---- */
        var gi = Math.floor(t * 12);
        if (gi !== lastGrain) {
          var gx = ((gi * 97) % 200) - 100;
          var gy = ((gi * 61 + 37) % 200) - 100;
          gr.style.transform = "translate(" + gx + "px," + gy + "px)";
          lastGrain = gi;
        }

        /* ---- iris to black on the button: soft circle closing from 2.60, fast close 4.00 to 4.45 ---- */
        var R = irisR(t);
        var bg;
        if (R >= 1300) {
          bg = "transparent";
        } else if (R <= 0.5) {
          bg = "#000000";
        } else {
          var soft = 180 * Math.min(1, R / 300);
          bg =
            "radial-gradient(circle at " + IX + "px " + IY + "px, rgba(0,0,0,0) " + R.toFixed(1) + "px, rgba(0,0,0,1) " +
            (R + soft).toFixed(1) + "px)";
        }
        if (bg !== lastIris) {
          iris.style.background = bg;
          lastIris = bg;
        }
      }

      /* ============ timeline ============ */
      var tl = gsap.timeline({ paused: true });
      var clock = { t: 0 };
      render(0);
      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            render(clock.t);
          }
        },
        0
      );

      /* ---------------- Scene 1 (0.00 to 2.12): P20, the button ---------------- */
      // 0.00 the braise halo opens at the center (0 -> 1, 0.3 s expo.out)
      var halo = byId("p11-halo");
      tl.fromTo(halo, { opacity: 0, scale: 0.85 }, { opacity: 0.75, scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, 0);

      // 0.10 COUVERT lands letter by letter (x1.4, blur -> sharp, 0.03 s apart)
      toArr(byId("p11-wordmark").getElementsByClassName("p11-l")).forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, scale: 1.4, filter: "blur(8px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out", immediateRender: false },
          0.1 + i * 0.03
        );
      });

      // 0.45 the promise arrives word by word
      toArr(byId("p11-promise").getElementsByClassName("p11-pw")).forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 10, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.16, ease: "expo.out", immediateRender: false },
          0.45 + i * 0.035
        );
      });

      // 0.65 the button arrives x1.1 blur -> sharp (0.12 s), with a ring that opens
      tl.fromTo(
        byId("p11-btnwrap"),
        { opacity: 0, scale: 1.1, filter: "blur(6px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out", immediateRender: false },
        0.65
      );
      tl.fromTo(
        byId("p11-pulse"),
        { opacity: 0.9, scale: 1 },
        { opacity: 0, scale: 1.16, duration: 0.45, ease: "power2.out", immediateRender: false },
        0.7
      );

      // 0.90 the URL
      tl.fromTo(
        byId("p11-url"),
        { opacity: 0, y: 6, filter: "blur(4px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "expo.out", immediateRender: false },
        0.9
      );

      // 1.22 the cursor enters from the bottom right (its path is in render)
      var curIn = byId("p11-cur-in");
      tl.fromTo(curIn, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, MOVE_AT);

      // 1.77 direct click: cursor x0.85 (0.06 s), button sinks with it, then both come back
      var btn = byId("p11-btn");
      tl.fromTo(curIn, { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power2.in", immediateRender: false }, CLICK - 0.06);
      tl.fromTo(curIn, { scale: 0.85 }, { scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, CLICK);
      tl.fromTo(btn, { scale: 1 }, { scale: 0.95, duration: 0.06, ease: "power1.in", immediateRender: false }, CLICK - 0.06);
      tl.fromTo(btn, { scale: 0.95 }, { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, CLICK);
      // paper -> pale braise -> braise, filling from the click point (0.12 s)
      tl.fromTo(byId("p11-pale"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, CLICK - 0.03);
      tl.fromTo(
        byId("p11-fill"),
        { clipPath: "circle(0px at 380px 68px)" },
        { clipPath: "circle(400px at 380px 68px)", duration: 0.12, ease: "expo.out", immediateRender: false },
        CLICK + 0.01
      );
      tl.fromTo(byId("p11-btnglow"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, CLICK);
      // the braise onde opens around the button (until 2.12)
      tl.fromTo(
        byId("p11-onde"),
        { opacity: 1, scale: 0.92 },
        { opacity: 0.5, scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false },
        CLICK
      );
      // the halo warms up after the click
      tl.fromTo(halo, { opacity: 0.75 }, { opacity: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, CLICK + 0.02);

      // subtitle: Essaie-le [gratuitement], un mois.  (grey 35 % then ink)
      var wordIn = function (id, at) {
        var el = byId(id);
        tl.fromTo(
          el,
          { opacity: 0, y: 8, filter: "blur(6px)" },
          { opacity: 0.35, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out", immediateRender: false },
          at
        );
        tl.fromTo(el, { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, at + 0.14);
      };
      wordIn("p11-w-essaie", 0.31);
      // the key-word box traces from the left (0.16 s power3.out), just before the word
      tl.fromTo(
        byId("p11-boxbg"),
        { opacity: 1, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false },
        0.6
      );
      wordIn("p11-w-gratuit", 0.63);
      wordIn("p11-w-comma", 0.63);
      wordIn("p11-w-un", 1.57);
      wordIn("p11-w-mois", 1.74);
      // the subtitle leaves from 2.00 to 2.12
      tl.fromTo(
        byId("p11-sub"),
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(4px)", duration: 0.12, ease: "power2.in", immediateRender: false },
        2.0
      );

      /* ---------------- Scene 2 (2.12 to 4.52): P21, the living hold, then the iris ---------------- */
      // 2.40 the cursor slides 20 px (render) and fades (0.3 s)
      tl.fromTo(curIn, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.4);

      // 2.60 to 4.00 the halo drifts and breathes in finite steps (2 cycles of 0.7 s)
      tl.fromTo(halo, { x: 0 }, { x: 26, duration: DUR - 2.6, ease: "none", immediateRender: false }, 2.6);
      for (var k = 0; k < 2; k++) {
        var b0 = 2.6 + k * 0.7;
        tl.fromTo(halo, { scale: 1 }, { scale: 1.07, duration: 0.35, ease: "sine.inOut", immediateRender: false }, b0);
        tl.fromTo(halo, { scale: 1.07 }, { scale: 1, duration: 0.35, ease: "sine.inOut", immediateRender: false }, b0 + 0.35);
        tl.fromTo(halo, { opacity: 1 }, { opacity: 0.86, duration: 0.35, ease: "sine.inOut", immediateRender: false }, b0);
        tl.fromTo(halo, { opacity: 0.86 }, { opacity: 1, duration: 0.35, ease: "sine.inOut", immediateRender: false }, b0 + 0.35);
      }
      // the button glow breathes with the halo
      var glow = byId("p11-btnglow");
      for (var j = 0; j < 2; j++) {
        var g0 = 2.6 + j * 0.7;
        tl.fromTo(glow, { opacity: 1 }, { opacity: 0.75, duration: 0.35, ease: "sine.inOut", immediateRender: false }, g0);
        tl.fromTo(glow, { opacity: 0.75 }, { opacity: 1, duration: 0.35, ease: "sine.inOut", immediateRender: false }, g0 + 0.35);
      }
      // 4.00 to 4.45 the iris closes to black on the button (render); black to 4.52

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
