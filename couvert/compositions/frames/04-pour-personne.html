      [3, 4, 5].forEach(function (k) { empties[k] = mk(dishes[k], "p04-empty", "empty" + k); });
      // la nourriture qui tombe (une par assiette jetée), posée sur le point de bascule (2730, 1690)
      var foods = [0, 1, 2].map(function (k) { return mk(world, "p04-food", "food" + k, "left:2730px;top:1690px"); });
      var lid = mk(world, "p04-lid", "lid");
      // filets de fumée des bougies qui s'éteignent
      var wisps = {};
      for (var tid in TB) { if (tid == 7 || tid == 4 || tid == 12) continue;
        wisps[tid] = mk(world, "p04-wisp", "wisp" + tid, "left:" + (TB[tid].x - 22) + "px;top:" + (TB[tid].y - 150) + "px"); }
      // l'horloge au-dessus du passe (devant)
      var clock = mk(world, "p04-clock", "clock", "", "20:58");
      var lamps = qa("#p04-stage .sl-lamp");

      var hole = $("hole"), black = $("black"), ember = $("ember");

      /* ===================== caméra : UN proxy, UN écrivain ===================== */
      var C = { cx: 1000, cy: 1680, s: 1.7, blur: 10, dx: 0 };
      var K = { m: 0 };
      var lastClock = "";
      function pad(n) { return (n < 10 ? "0" : "") + n; }
      function render() {
        SALLE.cam(world, C);
        var tot = 20 * 60 + 58 + Math.round(K.m), txt = pad(Math.floor(tot / 60) % 24) + ":" + pad(tot % 60);
        if (txt !== lastClock) { clock.textContent = txt; lastClock = txt; }
        var p = SALLE.toScreen(C, 940, 1180), k = Math.max(0.6, Math.min(1.4, C.s / 0.5));
        hole.style.transform = "translate(" + (p[0] - 2200).toFixed(2) + "px," + (p[1] - 2200).toFixed(2) + "px) scale(" + k.toFixed(4) + ")";
        ember.style.transform = "translate(" + (p[0] - 30).toFixed(2) + "px," + (p[1] - 30).toFixed(2) + "px)";
      }

      /* ===================== la timeline (une seule, en pause) ===================== */
      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) {
        if (pos > 0) to.immediateRender = false;
        tl.fromTo(target, from, to, pos);
      }
      function sw(target, from, to, pos) { to.duration = 0.001; to.ease = "none"; ft(target, from, to, pos); }
      function lerp(a, b, k) { return { cx: a.cx + (b.cx - a.cx) * k, cy: a.cy + (b.cy - a.cy) * k, s: a.s + (b.s - a.s) * k }; }
      function cp(o, extra) { var r = {}, n; for (n in o) r[n] = o[n]; for (n in extra) r[n] = extra[n]; return r; }

      // ---------- PISTE CAMÉRA ----------
      // 0.00 à 0.30 fin du whip (expo.out) sur le passe
      ft(C, { cx: 1000, cy: 1680, s: 1.7, blur: 10 }, { cx: 1600, cy: 1610, s: 1.35, blur: 0, duration: 0.30, ease: "expo.out" }, 0);
      // 0.30 à 1.35 dérive latérale +20 u/s
      ft(C, { cx: 1600 }, { cx: 1621, duration: 1.05, ease: "none" }, 0.30);
      // 1.35 à 1.55 filé vers la droite (power2.in, flou 0 → 8), 1.55 à 1.70 fin du filé sur la poubelle (expo.out) ;
      // point de raccord choisi pour que la vitesse soit la même des deux côtés (10·a = 46,2·b)
      var P0 = { cx: 1621, cy: 1610, s: 1.35 }, P1 = { cx: 2760, cy: 1720, s: 1.9 }, M1 = lerp(P0, P1, 0.822);
      ft(C, cp(P0, { blur: 0 }), cp(M1, { blur: 8, duration: 0.20, ease: "power2.in" }), 1.35);
      ft(C, cp(M1, { blur: 8 }), cp(P1, { blur: 0, duration: 0.15, ease: "expo.out" }), 1.55);
      // 1.75 secousse de 4 px (contact de la nourriture)
      ft(C, { dx: 0 }, { dx: 4, duration: 0.03, ease: "power1.out" }, 1.75);
      ft(C, { dx: 4 }, { dx: -3, duration: 0.04, ease: "sine.inOut" }, 1.78);
      ft(C, { dx: -3 }, { dx: 1.5, duration: 0.04, ease: "sine.inOut" }, 1.82);
      ft(C, { dx: 1.5 }, { dx: 0, duration: 0.05, ease: "sine.out" }, 1.86);
      // 1.70 à 3.10 dérive avant 1,9 → 2,0
      ft(C, { s: 1.9 }, { s: 2.0, duration: 1.40, ease: "none" }, 1.70);
      // 3.10 à 3.30 recul (power2.in, flou 0 → 8), 3.30 à 3.90 recul jusqu'au plan large (expo.out) ; raccord 10·a = 11,55·b
      var P2 = { cx: 2760, cy: 1720, s: 2.0 }, P3 = { cx: 1640, cy: 1000, s: 0.5 }, M2 = lerp(P2, P3, 0.536);
      ft(C, cp(P2, { blur: 0 }), cp(M2, { blur: 8, duration: 0.20, ease: "power2.in" }), 3.10);
      ft(C, cp(M2, { blur: 8 }), cp(P3, { blur: 0, duration: 0.60, ease: "expo.out" }), 3.30);
      // 3.90 à 5.02 glissement vers T12, cam(940, 920, 0.5) ; en y : départ arrêté, fin en dérive lente (10 u/s, l'image descend)
      ft(C, { cx: 1640 }, { cx: 940, duration: 1.12, ease: "power2.inOut" }, 3.90);
      var SLOPE = 10 * 0.62 / 80;
      function easeDrift(u) { return (SLOPE - 2) * u * u * u + (3 - SLOPE) * u * u; }
      ft(C, { cy: 1000 }, { cy: 920, duration: 0.62, ease: easeDrift }, 4.40);

      // ---------- SCÈNE 1 : vingt-deux heures au passe ----------
      // la lueur chaude des lampes du passe pulse (2 %), boucle finie
      for (var lp = 0, tp = 0.20; tp + 0.30 <= 4.80; lp++, tp += 0.30) {
        var up = lp % 2 === 0;
        ft(lamps, { scale: up ? 1 : 1.02 }, { scale: up ? 1.02 : 1, duration: 0.30, ease: "sine.inOut" }, tp);
      }
      // 0.40 « 20:58 » arrive ×1,3 flou → net (0,12 s)
      ft(clock, { opacity: 0, scale: 1.196, filter: "blur(8px)" }, { opacity: 1, scale: 0.92, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, 0.40);
      // 0.67 à 1.04 les chiffres roulent jusqu'à « 22:00 », l'échelle grandit avec le compte
      ft(K, { m: 0 }, { m: 62, duration: 0.37, ease: "power2.out" }, 0.67);
      ft(clock, { scale: 0.92 }, { scale: 1, duration: 0.37, ease: "power2.out" }, 0.67);
      // 1.10 une lampe du passe s'éteint (celle de l'assiette de droite)
      ft(lamps[3], { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.out" }, 1.10);
      // l'horloge quitte le monde hors champ (caméra sur la poubelle)
      sw(clock, { opacity: 1 }, { opacity: 0 }, 2.00);

      // ---------- SCÈNE 2 : tu jettes ----------
      var POSE = { y: 70, rotation: -28, scaleX: 1.18, scaleY: 0.826, filter: "blur(2px)" };
      var REST = { x: 0, y: 0, rotation: 0, scaleX: 1, scaleY: 1, filter: "blur(0px)" };
      var BIN = [[2790, 1762], [2770, 1747], [2807, 1771]];
      function dump(n, k, tCue, tLeave) {
        var D = dishes[k], dx = 2730 - DISH_X[k], F = foods[n];
        // bascule (0,1 s power2.in) : l'assiette se couche au-dessus de la poubelle
        ft(D, { x: dx, y: 70, rotation: -28, scaleY: 0.826 }, { x: dx + 22, y: 82, rotation: -36, scaleY: 0.42, duration: 0.10, ease: "power2.in" }, tCue);
        // la nourriture se détache (même image) et tombe dans la poubelle : contact 0,08 s plus tard
        sw(empties[k], { opacity: 0 }, { opacity: 1 }, tCue);
        sw(F, { opacity: 0 }, { opacity: 1 }, tCue);
        ft(F, { x: 0, y: 0, rotation: -28, scaleX: 1.18, scaleY: 0.826, filter: "blur(2px)" },
          { x: BIN[n][0] - 2730, y: BIN[n][1] - 1690, rotation: 8, scaleX: 0.78, scaleY: 0.66, filter: "blur(6px)", duration: 0.08, ease: "power2.in" }, tCue);
        ft(F, { opacity: 1, filter: "blur(6px)" }, { opacity: 0.82, filter: "blur(3px)", duration: 0.20, ease: "power2.out" }, tCue + 0.08);
        // l'assiette repart vide, vers le passe (sortie plus rapide que l'entrée), puis quitte le monde hors champ
        ft(D, { x: dx + 22, y: 82, rotation: -36, scaleX: 1.18, scaleY: 0.42, filter: "blur(2px)" },
          { x: 2170 - DISH_X[k], y: -150, rotation: -14, scaleX: 1.1, scaleY: 0.8, filter: "blur(4px)", duration: 0.12, ease: "power2.in" }, tLeave);
        sw(D, { opacity: 1 }, { opacity: 0 }, tLeave + 0.14);
      }
      // 1.35 l'assiette de droite glisse de 20 px vers la droite, puis part avec la caméra : au-dessus de la poubelle à 1.60, −28°
      ft(dishes[5], { x: 0 }, { x: 15, duration: 0.10, ease: "power2.out" }, 1.35);
      ft(dishes[5], cp(REST, { x: 15 }), cp(POSE, { x: 700, duration: 0.15, ease: "power2.inOut" }), 1.45);
      dump(0, 5, 1.67, 1.90);
      // 2.14 une deuxième assiette, 2.45 une troisième (elles arrivent du passe, hors champ à gauche)
      ft(dishes[4], REST, cp(POSE, { x: 2730 - DISH_X[4], duration: 0.16, ease: "expo.out" }), 1.96);
      dump(1, 4, 2.14, 2.26);
      ft(dishes[3], REST, cp(POSE, { x: 2730 - DISH_X[3], duration: 0.14, ease: "expo.out" }), 2.29);
      dump(2, 3, 2.45, 2.70);
      // 3.00 le couvercle se rabat (0,1 s)
      sw(lid, { opacity: 0 }, { opacity: 1 }, 2.90);
      ft(lid, { scaleY: 0.08 }, { scaleY: 1, duration: 0.10, ease: "power2.in" }, 2.90);

      // ---------- SCÈNE 3 : pour personne, la salle s'éteint ----------
      function candleOut(tid, t0) {
        var tb = TB[tid];
        ft(tb.candle, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, t0);
        ft(tb.halo, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.20, ease: "power2.out" }, t0);
        ft(tb.topoff, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t0);
        ft(tb.tent, { opacity: 1 }, { opacity: 0.45, duration: 0.25, ease: "power2.out" }, t0);
        var w = wisps[tid];
        ft(w, { opacity: 0, y: 20, rotation: 6 }, { opacity: 0.6, y: 0, rotation: 0, duration: 0.15, ease: "power2.out" }, t0 + 0.04);
        ft(w, { opacity: 0.6, y: 0, rotation: 0 }, { opacity: 0, y: -60, rotation: -8, duration: 0.45, ease: "power1.in" }, t0 + 0.19);
      }
      // 3.70 sur « personne » : des bords vers T12, une à une
      var ORDER = [5, 9, 14, 8, 13, 1, 3, 2, 6, 10, 11];
      ORDER.forEach(function (tid, n) { candleOut(tid, 3.70 + n * 0.066); });
      // le parquet disparaît avec les halos ; seule T12 reste dans sa lumière
      ft(hole, { opacity: 0 }, { opacity: 0.92, duration: 0.80, ease: "power1.in" }, 3.70);
      // 4.86 la bougie de T12 s'éteint : sa lueur reste à 20 %, tout le reste est noir (fini à 4.95)
      ft(TB[12].candle, { opacity: 1 }, { opacity: 0, duration: 0.09, ease: "power2.in" }, 4.86);
      ft(TB[12].halo, { opacity: 1 }, { opacity: 0, duration: 0.09, ease: "power2.in" }, 4.86);
      ft(TB[12].topoff, { opacity: 0 }, { opacity: 1, duration: 0.09, ease: "power2.out" }, 4.86);
      ft(black, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.in" }, 4.80);
      ft(ember, { opacity: 0 }, { opacity: 0.2, duration: 0.11, ease: "power2.out" }, 4.84);

      // ---------- SOUS-TITRES ----------
      qa("#p04-subs .p04-w").forEach(function (w) {
        var t0 = parseFloat(w.getAttribute("data-cue")) - 0.02;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 0.35, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, t0);
        ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, t0 + 0.14);
      });
      // [boîte : jettes] se trace depuis la gauche
      ft($("box"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.63);
      // [trait : personne] 3.70 à 4.10
      ft($("stroke"), { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.40, ease: "power2.out" }, 3.70);
      function subOut(id, t0, dur, x) {
        ft($(id), { opacity: 1, x: 0, filter: "blur(0px)" }, { opacity: 0, x: x, filter: "blur(6px)", duration: dur, ease: "power2.in" }, t0);
      }
      subOut("subA", 1.38, 0.12, -30);
      subOut("subB", 3.16, 0.14, 0);
      subOut("subC", 4.40, 0.14, 0);

      // longueur exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
