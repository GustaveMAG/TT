        var W = SALLE.build(byId("p08-ground"), { light: true });
        var TB = W.tables;
        var WAIT = { 9: 1, 11: 1, 13: 1, 14: 1 };
        for (var id in TB) { if (!WAIT[id]) TB[id].tag.style.opacity = 1; }

        /* centre de l'étiquette de T4 dans le monde (x = centre de la table ; y mesuré une fois) */
        var t4 = TB[4];
        var TAGX = 2320;
        var TAGY = (480 - 90) + t4.tag.offsetTop + (t4.tag.offsetHeight || 41) / 2;

        /* ---- caméra : UN objet, appliqué dans UN onUpdate ---- */
        var C = { cx: 2000, cy: 640, s: 1.25, blur: 8, dx: 0 };
        /* plan large : cam(1640, 1080, 0.5), décalé à gauche : le mur gauche (x 290) à l'écran x 58, la carte à droite
           (x 1450 à 1868) : marges ~52 px de chaque côté pendant la dérive */
        var WIDE = { cx: 1640, cy: 1080, s: 0.5, dx: -227 };
        var END = { cx: 1100, cy: 1500, s: 1.0, dx: 0, blur: 10 };

        /* ---- la ligne Dubois en vol : progression p, survol lift, rotation, échelle de la ligne sc, échelle de l'étiquette ts ---- */
        var F = { p: 0, lift: 1, rot: 0, sc: 1, ts: 2.3 };
        var fly = byId("p08-fly"), flyRow = byId("p08-flyrow"), flyTag = byId("p08-flytag");
        var S0X = 1476 + 183, S0Y = 300 + 45; /* centre de la ligne Dubois dans la carte */

        function render() {
          SALLE.cam(W.world, C);
          var tg = SALLE.toScreen(C, TAGX, TAGY);
          var tx = (tg[0] - S0X) * F.p;
          var ty = (tg[1] - 26 * F.lift - S0Y) * F.p;
          fly.style.transform = "translate(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px) rotate(" + F.rot.toFixed(3) + "deg)";
          flyRow.style.transform = "scale(" + F.sc.toFixed(4) + ")";
          flyTag.style.transform = "translate(-50%,-50%) scale(" + (C.s * F.ts).toFixed(4) + ")";
        }

        var tl = gsap.timeline({ paused: true, defaults: { lazy: false }, onUpdate: render });

        /* outil : bascule instantanée (aucun rendu avant son heure) */
        function at(el, from, to, t) {
          to.duration = 0.001; to.ease = "none"; to.immediateRender = false;
          tl.fromTo(el, from, to, t);
        }

        /* =========================== CAMÉRA =========================== */
        /* 0.00 à 0.25 : fin du filé sur T4, plan flou 8 → 6 px */
        tl.fromTo(C, { cx: 2000, cy: 640, s: 1.25, blur: 8 }, { cx: 2320, cy: 560, s: 1.3, blur: 6, duration: 0.25, ease: "power3.out" }, 0);
        /* 0.25 à 1.05 : dérive avant 1,3 → 1,35 */
        tl.fromTo(C, { s: 1.3 }, { s: 1.35, duration: 0.8, ease: "none", immediateRender: false }, 0.25);
        /* 1.05 à 1.25 : départ du recul */
        tl.fromTo(C, { cx: 2320, cy: 560, s: 1.35, dx: 0 }, { cx: 2250, cy: 600, s: 1.15, dx: -20, duration: 0.2, ease: "power2.in", immediateRender: false }, 1.05);
        /* 1.25 à 1.70 : recul (expo.out) sur le plan large décalé à gauche ; le plan redevient net */
        tl.fromTo(C, { cx: 2250, cy: 600, s: 1.15, dx: -20, blur: 6 },
          { cx: WIDE.cx, cy: WIDE.cy, s: WIDE.s, dx: WIDE.dx, blur: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, 1.25);
        /* 1.70 à 3.60 : dérive latérale +12 u/s */
        tl.fromTo(C, { cx: WIDE.cx }, { cx: WIDE.cx + 12 * 1.9, duration: 1.9, ease: "none", immediateRender: false }, 1.7);
        /* 3.60 à 3.84 : travelling vers le bas-gauche (la cuisine), power2.in, flou 0 → 10 px */
        tl.fromTo(C, { cx: WIDE.cx + 12 * 1.9, cy: WIDE.cy, s: WIDE.s, dx: WIDE.dx, blur: 0 },
          { cx: END.cx, cy: END.cy, s: END.s, dx: END.dx, blur: END.blur, duration: 0.24, ease: "power2.in", immediateRender: false }, 3.6);

        /* =========================== SCENE 1 : le téléphone, une annulation =========================== */
        var phone = byId("p08-phone");
        /* le téléphone finit sa glissade vers la droite avec la caméra, puis respire à peine */
        tl.fromTo(phone, { x: 0 }, { x: 30, duration: 0.25, ease: "power3.out" }, 0);
        tl.fromTo(phone, { y: 0 }, { y: -6, duration: 0.75, ease: "none", immediateRender: false }, 0.25);
        /* le fil de T4 glisse à la place de celui de Martin (0,1 s) */
        tl.fromTo("#p08-thold", { x: 0, opacity: 1 }, { x: -392, opacity: 0.4, duration: 0.1, ease: "power2.inOut", immediateRender: false }, 0.12);
        tl.fromTo("#p08-thnew", { x: 392, opacity: 1 }, { x: 0, opacity: 1, duration: 0.1, ease: "power2.inOut", immediateRender: false }, 0.12);
        /* 0.29 la bulle entrante ; 0.43 la réponse « Désolés, on ne pourra pas venir. » */
        tl.fromTo("#p08-bin", { opacity: 0, scale: 0.9, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, 0.28);
        tl.fromTo("#p08-bout", { opacity: 0, scale: 0.9, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, 0.42);
        /* 0.70 derrière, l'étiquette de T4 passe à « Libérée » (contour braise, 0,12 s) */
        tl.fromTo(t4.tag, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, 0.7);
        tl.fromTo(t4.free, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.12, ease: "expo.out", immediateRender: false }, 0.7);
        /* 1.00 le téléphone part vers le haut (0,2 s power2.in) */
        tl.fromTo(phone, { y: -6, filter: "blur(0px)" }, { y: -1000, filter: "blur(10px)", duration: 0.2, ease: "power2.in", immediateRender: false }, 1.0);

        /* =========================== SCENE 2 : la liste d'attente =========================== */
        /* 1.40 la carte s'ouvre : un trait de 2 px qui s'ouvre en panneau (0,22 s) */
        tl.fromTo("#p08-cline", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.09, ease: "power3.out", immediateRender: false }, 1.4);
        tl.fromTo("#p08-card", { opacity: 1, scaleY: 2 / 450 }, { opacity: 1, scaleY: 1, duration: 0.13, ease: "expo.out", immediateRender: false }, 1.49);
        tl.fromTo("#p08-cline", { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "power1.in", immediateRender: false }, 1.5);
        /* ses trois lignes */
        tl.fromTo("#p08-ctitle", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out", immediateRender: false }, 1.54);
        ["#p08-r0", "#p08-r1", "#p08-r2"].forEach(function (sel, i) {
          tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out", immediateRender: false }, 1.57 + i * 0.04);
        });

        /* 1.74 sur « repart » : la ligne Dubois se détache (×1,1, braise) — la ligne volante prend sa place au pixel */
        at("#p08-r0", { opacity: 1 }, { opacity: 0 }, 1.74);
        at(fly, { opacity: 0 }, { opacity: 1 }, 1.74);
        tl.fromTo(F, { sc: 1 }, { sc: 1.1, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.74);
        tl.fromTo(flyRow, { backgroundColor: "#f6f1e8", boxShadow: "0 0px 0px rgba(196,83,42,0)" },
          { backgroundColor: "#c4532a", boxShadow: "0 20px 40px rgba(196,83,42,0.35)", duration: 0.16, ease: "power3.out", immediateRender: false }, 1.74);
        tl.fromTo("#p08-flynm", { color: "#1c1612" }, { color: "#ffffff", duration: 0.16, ease: "power3.out", immediateRender: false }, 1.74);
        tl.fromTo("#p08-flypp", { color: "#5c5348" }, { color: "rgba(255,255,255,0.85)", duration: 0.16, ease: "power3.out", immediateRender: false }, 1.74);
        tl.fromTo("#p08-arrow", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.8);

        /* 2.10 sur « aussitôt » : elle file vers T4 (0,3 s expo.out, flou de bougé 6 px, rotation −6° → 0) */
        tl.fromTo(F, { rot: 0 }, { rot: -6, duration: 0.04, ease: "power2.in", immediateRender: false }, 2.06);
        tl.fromTo(F, { p: 0, sc: 1.1, rot: -6 }, { p: 1, sc: 0.5, rot: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, 2.1);
        tl.fromTo(fly, { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false }, 2.1);

        /* 2.45 elle se pose sur T4 et devient son étiquette « Confirmé » (même nœud, rétrécit en 0,05 s) */
        tl.fromTo(F, { lift: 1, sc: 0.5, ts: 2.3 }, { lift: 0, sc: 0.2, ts: 1, duration: 0.05, ease: "power2.out", immediateRender: false }, 2.45);
        tl.fromTo(flyRow, { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, 2.45);
        tl.fromTo(flyTag, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, 2.45);
        tl.fromTo(t4.free, { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, 2.45);
        /* l'étiquette du monde prend le relais, au même pixel (elle suit la dérive de la caméra) */
        at(t4.tag, { opacity: 0 }, { opacity: 1 }, 2.52);
        at(fly, { opacity: 1 }, { opacity: 0 }, 2.52);

        /* 2.60 Morel et Leroy remontent d'un cran (FLIP 0,2 s) */
        tl.fromTo(["#p08-r1", "#p08-r2"], { y: 0 }, { y: -110, duration: 0.2, ease: "power3.out", immediateRender: false }, 2.6);

        /* 3.00 T9, T11, T13, T14 reçoivent leur étiquette (0,1 s d'écart) : les 14 tables */
        [9, 11, 13, 14].forEach(function (n, i) {
          tl.fromTo(TB[n].tag, { opacity: 0, scale: 1.6, y: -30, filter: "blur(6px)" },
            { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "expo.out", immediateRender: false }, 3.0 + i * 0.1);
        });

        /* 3.55 la carte sort par la droite */
        tl.fromTo("#p08-card", { x: 0 }, { x: 520, duration: 0.2, ease: "power2.in", immediateRender: false }, 3.55);

        /* =========================== SOUS-TITRES (mot à mot) =========================== */
        var INK = "#1c1612", INK_G = "rgba(28,22,18,0.35)", PAPER = "#f5efe4", PAPER_G = "rgba(245,239,228,0.35)";
        function word(el, t, inBox) {
          tl.fromTo(el, { opacity: 0, y: 8, filter: "blur(6px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo(el, { color: inBox ? PAPER_G : INK_G }, { color: inBox ? PAPER : INK, duration: 0.2, ease: "power1.inOut", immediateRender: false }, t + 0.1);
        }
        function box(el, t) {
          tl.fromTo(el, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, t);
        }
        function leave(el, t) {
          tl.fromTo(el, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -10, filter: "blur(4px)", duration: 0.12, ease: "power2.in", immediateRender: false }, t);
        }
        var E = 1 / 30; /* un mot paraît une image avant son repère, jamais après */

        /* « Une [annulation] ? » : Une 0.29, boîte 0.41, annulation 0.43 */
        var w1 = toArr(byId("p08-s1").getElementsByClassName("p08-w"));
        word(w1[0], 0.29 - E);
        box(byId("p08-box1"), 0.43 - 2 * E);
        word(w1[1], 0.43 - E, true);
        word(w1[2], 0.43 - E);
        leave(byId("p08-s1"), 1.1);

        /* « La place repart aussitôt à la [liste d'attente]. » */
        var w2 = toArr(byId("p08-s2").getElementsByClassName("p08-w"));
        var CUE2 = [1.39, 1.57, 1.74, 2.10, 2.63, 2.81, 2.99, 3.16, 3.16];
        for (var i = 0; i < w2.length; i++) word(w2[i], CUE2[i] - E, i === 6 || i === 7);
        box(byId("p08-box2"), 2.99 - 2 * E);
        leave(byId("p08-s2"), 3.68);

        render();

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
  </div>
</template>
