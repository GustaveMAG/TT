        gsap.set(TB[id].candle, { opacity: 0 });
        gsap.set(TB[id].halo, { opacity: 0 });
        gsap.set(TB[id].topoff, { opacity: 0.45 });
      });
      gsap.set(T12.tent, { opacity: 1, scaleY: 0.2, transformOrigin: "50% 100%" });

      /* ---- the ONE camera proxy, applied in a single writer ---- */
      var C = { cx: 940, cy: 1150, s: 2.7, blur: 0, dx: 0 };
      var glassp = $("glassp");
      function render() {
        SALLE.cam(W.world, C);
        // foreground glass : 2:1 parallax on the forward drift of scene 1
        var k = 1 + 2 * (Math.max(C.s, 2.7) / 2.7 - 1);
        glassp.style.transform = "scale(" + k + ")";
      }

      /* ===================== the one paused timeline ===================== */
      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- camera track ---- */
      // scene 1 : forward drift, scale 2.7 -> 2.85, linear
      ft(C, { s: 2.7 }, { s: 2.85, duration: 1.9, ease: "none" }, 0);
      // 1.90 : clean pull-back (0.7 s expo.out) to the wide plan, framing shifted 380 px left ; T12 stays centered early on
      ft(C, { s: 2.85 }, { s: 0.5, duration: 0.7, ease: "expo.out" }, 1.9);
      ft(C, { cx: 940, cy: 1150, dx: 0 }, { cx: 1640, cy: 1000, dx: -380, duration: 0.7, ease: "power2.inOut" }, 1.9);
      // 2.60 -> 3.90 : lateral drift +15 u/s
      ft(C, { cx: 1640 }, { cx: 1659.5, duration: 1.3, ease: "none" }, 2.6);
      // 3.90 -> 4.40 : cran forward toward T12 (power2.in, blur 0 -> 8), handed over mid-move to frame 2
      ft(C, { cx: 1659.5, cy: 1000, s: 0.5, dx: -380, blur: 0 }, { cx: 940, cy: 1180, s: 1.8, dx: 0, blur: 8, duration: 0.5, ease: "power2.in" }, 3.9);

      /* ---- scene 1 : the candle of T12 ---- */
      var match = $("match");
      // 0.00 the match enters from the bottom edge (x1.4, blur 8 -> sharp in 0.1 s)
      ft(match, { opacity: 1, x: 0, y: 720, scale: 1.4, rotation: -28, filter: "blur(8px)", transformOrigin: "50% 0%" },
        { y: 0, scale: 1, rotation: -28, filter: "blur(0px)", duration: 0.1, ease: "power3.out" }, 0);
      // after lighting it eases back a hair, then leaves fast at 0.55
      ft(match, { x: 0, y: 0, rotation: -28 }, { x: 14, y: 18, rotation: -26, duration: 0.33, ease: "sine.inOut" }, 0.2);
      ft(match, { x: 14, y: 18, rotation: -26 }, { x: 60, y: 760, rotation: -20, duration: 0.18, ease: "power2.in" }, 0.55);

      // 0.08 on "Samedi" the candle of T12 lights : white core pop, halo 0 -> 1 in 0.15 s
      ft(T12.candle, { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.15, ease: "expo.out" }, 0.08);
      ft(T12.halo, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.15, ease: "expo.out" }, 0.08);
      // 0.30 the cloth warms up (tone 0.6 -> 1, 0.3 s)
      ft(T12.topoff, { opacity: 0.45 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 0.3);
      // 0.80 the tent card stands up (scaleY 0.2 -> 1, 0.12 s)
      ft(T12.tent, { scaleY: 0.2 }, { scaleY: 1, duration: 0.12, ease: "power3.out" }, 0.8);
      // 1.06 "20:00" prints in braise for 0.3 s then back to ink
      var hha = root.querySelector("#p01-hha");
      ft(hha, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power2.out" }, 1.06);
      ft(hha, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.out" }, 1.36);
      // 1.40 the flame flickers : 0.6 s loop, 2 px, a finite count that lands at rest on 4.40
      var FL = [[0.15, 0.8, 1.06], [0.2, -0.6, 0.96], [0.15, 0.35, 1.03], [0.1, 0, 1]];
      var nLoops = Math.floor((DUR - 1.4) / 0.6 + 1e-6);
      for (var L = 0; L < nLoops; L++) {
        var t0 = 1.4 + L * 0.6, px = 0, ps = 1;
        FL.forEach(function (f) {
          ft(T12.candle, { x: px, scale: ps }, { x: f[1], scale: f[2], duration: f[0], ease: "sine.inOut" }, t0);
          t0 += f[0]; px = f[1]; ps = f[2];
        });
      }

      // foreground glass : leaves as the camera pulls back (no foreground in scene 2)
      ft($("glass"), { x: 0, y: 0, scale: 1, opacity: 1 }, { x: -560, y: 140, scale: 0.8, opacity: 0, duration: 0.28, ease: "power2.out" }, 1.9);

      /* ---- scene 2 : the room is full, on paper ---- */
      // 2.10 -> 2.60 the 13 other candles light in cascade, nearest first (0.04 s apart, each halo x1.3 -> 1)
      var order = SALLE.T.filter(function (t) { return t.id !== 12; }).map(function (t) {
        return { id: t.id, d: Math.sqrt((t.x - 940) * (t.x - 940) + (t.y - 1180) * (t.y - 1180)) };
      }).sort(function (a, b) { return (a.d - b.d) || (a.id - b.id); });
      order.forEach(function (o, i) {
        var tb = TB[o.id], t = 2.1 + i * 0.04;
        ft(tb.candle, { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.16, ease: "expo.out" }, t);
        ft(tb.halo, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, t);
        ft(tb.topoff, { opacity: 0.45 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, t);
        // 2.64 on "pleine" every table gets its RÉSERVÉ tent card (0.02 s apart)
        ft(tb.tent, { opacity: 0, scaleY: 0.2, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "power3.out" }, 2.64 + i * 0.02);
      });

      // 2.86 the reservation book arrives from the right (x1.15, blur 8 -> sharp) and settles tilted 3 deg
      var cahier = $("cahier");
      ft(cahier, { opacity: 1, x: 820 }, { x: 0, duration: 0.26, ease: "expo.out" }, 2.86);
      ft(cahier, { scale: 1.15, rotation: 7, filter: "blur(8px)" }, { scale: 1, rotation: 3, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, 2.86);
      // 3.10 the COMPLET stamp hits (x1.6 -> 1 in 0.08 s), the book gives 2 %
      ft($("stamp"), { opacity: 0, scale: 1.6, rotation: -9, filter: "blur(4px)" }, { opacity: 0.92, scale: 1, rotation: -9, filter: "blur(0px)", duration: 0.08, ease: "power3.out" }, 3.1);
      ft($("cahin"), { scale: 1 }, { scale: 0.98, duration: 0.05, ease: "power2.out" }, 3.15);
      ft($("cahin"), { scale: 0.98 }, { scale: 1, duration: 0.2, ease: "power2.out" }, 3.2);
      // 3.78 on "papier" the book slides 30 px, 3.95 it leaves to the right (0.35 s power2.in)
      ft(cahier, { x: 0 }, { x: 30, duration: 0.17, ease: "power1.in" }, 3.78);
      ft(cahier, { x: 30 }, { x: 1000, duration: 0.35, ease: "power2.in" }, 3.95);

      /* ---- the voice line : word by word, grey (35 %) then ink ; one box per sentence, the peak stroke ---- */
      Array.prototype.forEach.call(root.querySelectorAll(".p01-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")), boxed = w.classList.contains("p01-wk"), at = Math.max(0, cue - 0.02);
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: boxed ? 1 : 0.35, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, at);
        if (!boxed) ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, at + 0.14);
      });
      ft($("bx1"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 0.8);
      ft($("bx2"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.62);
      // the peak stroke under "sur le papier" draws from the left, 3.50 -> 3.95
      ft($("trw"), { opacity: 1, xPercent: -100 }, { xPercent: 0, duration: 0.45, ease: "power2.out" }, 3.5);
      ft($("trs"), { xPercent: 100 }, { xPercent: 0, duration: 0.45, ease: "power2.out" }, 3.5);
      // the sentences leave before each seam
      ft($("s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.76);
      ft($("s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.24);

      // exact frame length
      tl.set({}, {}, DUR);

      // first image = handoff_in, before any seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
