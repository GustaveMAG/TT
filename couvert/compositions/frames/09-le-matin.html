      var dateChars = splitChars(byId("p09-sl-date"));
      var microChars = splitChars(cMicro);

      /* ---- caméra : UN proxy {cx, cy, s, blur, dx}, appliqué par SALLE.cam dans le seul onUpdate ---- */
      var cam = { cx: 1100, cy: 1500, s: 1.0, blur: 10, dx: 0 };
      var cnt = { v: 0 };
      var lastN = -1;
      function render() {
        SALLE.cam(R.world, cam);
        var n = Math.round(cnt.v);
        if (n !== lastN) { cNum.textContent = String(n); lastN = n; }
      }

      var tl = gsap.timeline({ paused: true, defaults: { lazy: false }, onUpdate: render });

      /* ===== PISTE CAMÉRA ===== */
      /* 0.00 à 0.30 : fin du travelling (bas-gauche) sur le liège cam(510, 1720, 1.6), flou 10 → 0 */
      tl.fromTo(cam, { cx: 1100, cy: 1500, s: 1.0 }, { cx: 510, cy: 1720, s: 1.6, duration: 0.30, ease: "power3.out" }, 0);
      tl.fromTo(cam, { blur: 10 }, { blur: 0, duration: 0.30, ease: "power3.out" }, 0);
      /* 0.30 à 1.06 : dérive avant 1,6 → 1,65 */
      tl.fromTo(cam, { s: 1.6 }, { s: 1.65, duration: 0.76, ease: "none", immediateRender: false }, 0.30);
      /* 1.06 : bascule de netteté, le fond se floute à 4 px ; le cadrage glisse pour loger la carte à droite (marges égales) */
      tl.fromTo(cam, { blur: 0 }, { blur: 4, duration: 0.30, ease: "power2.inOut", immediateRender: false }, 1.06);
      tl.fromTo(cam, { dx: 0 }, { dx: -300, duration: 0.60, ease: "power3.out", immediateRender: false }, 1.06);
      /* 1.06 à 3.60 : dérive latérale +10 u/s */
      tl.fromTo(cam, { cx: 510 }, { cx: 535.4, duration: 2.54, ease: "none", immediateRender: false }, 1.06);
      /* 2.43 : le focus passe de la carte au bon (le « 38 » s'y pose) */
      tl.fromTo(cam, { blur: 4 }, { blur: 0, duration: 0.25, ease: "power2.inOut", immediateRender: false }, 2.43);
      /* 3.60 à 3.88 : recul vers le haut-droite, power2.in, flou 0 → 10 (en plein recul à la dernière image) */
      tl.fromTo(cam, { cx: 535.4, cy: 1720, s: 1.65, dx: -300 }, { cx: 1100, cy: 1300, s: 0.8, dx: 0, duration: 0.28, ease: "power2.in", immediateRender: false }, 3.60);
      tl.fromTo(cam, { blur: 0 }, { blur: 10, duration: 0.28, ease: "power2.in", immediateRender: false }, 3.60);

      /* ===== Scene 1 (0.00 à 1.06) : P16, et le matin ===== */
      /* 0.10 : le rai de soleil traverse la cuisine en diagonale (0,4 s, opacité 0 → 0,55), puis glisse encore */
      tl.fromTo(ray, { opacity: 0, x: -420, y: -260 }, { opacity: 0.55, x: 0, y: 0, duration: 0.40, ease: "power3.out", immediateRender: false }, 0.10);
      tl.fromTo(ray, { x: 0, y: 0 }, { x: 36, y: 22, duration: 0.56, ease: "none", immediateRender: false }, 0.50);
      /* il s'efface quand la carte prend le regard (sortie plus rapide que l'entrée) */
      tl.fromTo(ray, { opacity: 0.55 }, { opacity: 0, duration: 0.30, ease: "power2.in", immediateRender: false }, 1.06);

      /* 0.40 : le bon vierge s'épingle (×1,2 flou → net, 0,12 s), même place que le « 40 » du soir */
      tl.fromTo(slip, { opacity: 0, scale: 1.2, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out", immediateRender: false }, 0.40);
      /* 0.61 : sur « matin », « SAM. 14 · 08:00 » s'imprime */
      tl.fromTo(dateChars, { opacity: 0 }, { opacity: 1, duration: 0.02, stagger: 0.012, ease: "none", immediateRender: false }, 0.61);
      /* 0.80 : le « -- » clignote une fois */
      tl.fromTo(slDash, { opacity: 1 }, { opacity: 0.12, duration: 0.08, ease: "power2.in", immediateRender: false }, 0.80);
      tl.fromTo(slDash, { opacity: 0.12 }, { opacity: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 0.88);

      /* ===== Scene 2 (1.06 à 3.88) : P17, tu sais exactement ===== */
      /* 1.06 : la carte Couvert arrive à droite du bon, ×1,15 flou 8 → net (0,14 s) */
      tl.fromTo(card, { opacity: 0, scale: 1.15, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.14, ease: "power3.out", immediateRender: false }, 1.06);
      /* 1.37 : « SAMEDI 14 · CE SOIR » */
      tl.fromTo(microChars, { opacity: 0 }, { opacity: 1, duration: 0.02, stagger: 0.011, ease: "none", immediateRender: false }, 1.37);
      /* 1.55 : sur « exactement », le « 38 » roule de 0 à 38 (0,45 s), en grandissant (counting-dynamic-scale) */
      tl.fromTo(cNum, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, 1.53);
      tl.fromTo(cnt, { v: 0 }, { v: 38, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.55);
      tl.fromTo(cNum, { scale: 0.55 }, { scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.55);
      /* 2.10 « couverts confirmés », 2.30 « 14 tables · 0 en attente » */
      tl.fromTo(cL1, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 2.10);
      tl.fromTo(cL2, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 2.30);

      /* 2.43 : sur « combien », le « 38 » vole de la carte jusqu'au bon (0,25 s) et remplace « -- » */
      /* cible : le coin haut-gauche du nombre du bon (local 22, 112), bon incliné de -3° autour de son centre (510, 1705),
         vu par la caméra à 2.68 : cx = 510 + 10 × 1.62, cy 1720, s 1.65, dx -300 */
      var A = -3 * Math.PI / 180;
      var lx = 22 - 140, ly = 112 - 135;
      var wx = 510 + lx * Math.cos(A) - ly * Math.sin(A);
      var wy = 1705 + lx * Math.sin(A) + ly * Math.cos(A);
      var LAND = 2.68;
      var land = SALLE.toScreen({ cx: 510 + 10 * (LAND - 1.06), cy: 1720, s: 1.65, dx: -300 }, wx, wy);
      var FLY_SCALE = 1.65 * 92 / 190;
      /* départ : le nombre de la carte, coin haut-gauche à l'écran (920 + 40, 250 + 150) */
      tl.fromTo(cNum, { opacity: 1 }, { opacity: 0, duration: 0.02, ease: "none", immediateRender: false }, 2.43);
      tl.fromTo(fly, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none", immediateRender: false }, 2.43);
      tl.fromTo(fly, { x: 960, y: 400, scale: 1, rotation: 0 }, { x: land[0], y: land[1], scale: FLY_SCALE, rotation: -3, duration: 0.25, ease: "power3.inOut", immediateRender: false }, 2.43);
      /* la carte passe au second plan (bascule de netteté) */
      tl.fromTo(card, { opacity: 1, filter: "blur(0px)" }, { opacity: 0.85, filter: "blur(4px)", duration: 0.25, ease: "power2.inOut", immediateRender: false }, 2.43);
      /* le « -- » s'efface sous le nombre qui arrive ; à l'atterrissage, le nombre devient celui du bon */
      tl.fromTo(slDash, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, 2.52);
      tl.fromTo(fly, { opacity: 1 }, { opacity: 0, duration: 0.02, ease: "none", immediateRender: false }, LAND);
      tl.fromTo(slNum, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none", immediateRender: false }, LAND);

      /* 2.97 : sur « cuisines », le bon tasse sur le liège */
      tl.fromTo(slip, { scale: 1 }, { scale: 0.965, duration: 0.07, ease: "power2.in", immediateRender: false }, 2.97);
      tl.fromTo(slip, { scale: 0.965 }, { scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 3.04);

      /* 3.50 : la carte se replie en pastille (×0,2), un disque clair comme une table */
      tl.fromTo([cMark, cMicro, cL1, cL2], { opacity: 1 }, { opacity: 0, duration: 0.03, ease: "none", immediateRender: false }, 3.50);
      tl.fromTo(card, { scale: 1, opacity: 0.85, filter: "blur(4px)" }, { scale: 0.2, opacity: 1, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, 3.50);
      /* le rectangle devient disque pendant qu'il rapetisse (échelle 0,6 → 0,25) */
      tl.fromTo(cardFace, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "power1.inOut", immediateRender: false }, 3.52);
      tl.fromTo(disc, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power1.inOut", immediateRender: false }, 3.52);
      /* 3.60 : la pastille file vers T12 (écran 832, 444 à 3.88) ; à la dernière image elle est en plein vol */
      tl.fromTo(card, { x: 0, y: 0 }, { x: -298, y: -42, duration: 0.28, ease: "power2.in", immediateRender: false }, 3.60);
      tl.fromTo(card, { filter: "blur(0px)" }, { filter: "blur(3px)", duration: 0.26, ease: "power2.in", immediateRender: false }, 3.62);

      /* ===== Sous-titre : mot par mot (gris 35 % puis encre pleine), boîte braise tracée depuis la gauche ===== */
      function word(el, t) {
        tl.fromTo(el, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 0.35, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(el, { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "power1.inOut", immediateRender: false }, t + 0.14);
      }
      function box(el, t) {
        tl.fromTo(el, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, t);
      }
      var E = 0.02; /* chaque mot arrive 0 à 2 images avant son repère, jamais après */
      var w1 = toArr(sub1.getElementsByClassName("p09-w"));
      var b1 = sub1.getElementsByClassName("p09-boxbg")[0];
      word(w1[0], 0.31 - E);   /* Et */
      word(w1[1], 0.46 - E);   /* le */
      box(b1, 0.59 - E);       /* boîte : matin */
      word(w1[2], 0.61 - E);   /* matin */
      word(w1[3], 0.61 - E);   /* , */
      /* la phrase continue en P17 : la première moitié sort avant « tu » */
      tl.fromTo(sub1, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -10, filter: "blur(4px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 0.98);

      var w2 = toArr(sub2.getElementsByClassName("p09-w"));
      var b2 = sub2.getElementsByClassName("p09-boxbg")[0];
      word(w2[0], 1.19 - E);   /* tu */
      word(w2[1], 1.37 - E);   /* sais */
      box(b2, 1.53 - E);       /* boîte : exactement */
      word(w2[2], 1.55 - E);   /* exactement */
      word(w2[3], 2.26 - E);   /* pour */
      word(w2[4], 2.43 - E);   /* combien */
      word(w2[5], 2.79 - E);   /* tu */
      word(w2[6], 2.97 - E);   /* cuisines. */
      /* sortie 3.60 à 3.74 */
      tl.fromTo(sub2, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -10, filter: "blur(4px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 3.60);

      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
