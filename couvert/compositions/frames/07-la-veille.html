        /* il sort pendant le cran (le téléphone occupera le haut du cadre) */
        tl.fromTo(micro, { opacity: 1, y: 0 }, { opacity: 0, y: -8, duration: 0.12, ease: "power2.in", immediateRender: false }, 1.8);

        /* 0.30 à 1.60 : les étiquettes « Confirmé » se posent de gauche à droite, 0,13 s d'écart, ×1,6 flou 6 → net en 0,12 s */
        var ORDER = [1, 6, 10, 2, 12, 3, 7, 4, 8, 5];
        ORDER.forEach(function (id, i) {
          var tag = R.tables[id].tag;
          var t0 = 0.3 + i * 0.13;
          tl.fromTo(tag, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, t0);
          tl.fromTo(tag, { scale: 1.6, y: -40, filter: "blur(6px)" },
            { scale: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "expo.out", immediateRender: false }, t0);
        });

        /* ---- un mot arrive : gris, y +8, flou 6 → 0 en 0,14 s, puis couleur pleine en 0,2 s ---- */
        function word(el, cue, gray, full, colorDelay, colorDur) {
          var t = Math.max(0, cue - 0.025);
          tl.fromTo(el, { opacity: 0, y: 8, filter: "blur(6px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo(el, { color: gray }, { color: full, duration: colorDur || 0.2, ease: "power1.inOut", immediateRender: false }, t + (colorDelay || 0.1));
        }
        function boxTrace(el, t) {
          tl.fromTo(el, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, t);
        }

        /* « Il confirme chaque table [la veille], » */
        word(w1[0], 0.26, INK_GRAY, INK);
        word(w1[1], 0.48, INK_GRAY, INK);
        word(w1[2], 0.91, INK_GRAY, INK);
        word(w1[3], 1.34, INK_GRAY, INK);
        boxTrace(box1, 1.52);
        word(w1[4], 1.55, PAPER_GRAY, PAPER, 0.02, 0.1);
        word(w1[5], 1.76, PAPER_GRAY, PAPER, 0.02, 0.1);
        word(w1[6], 1.76, INK_GRAY, INK);
        /* la phrase cède la place à sa suite (« par SMS. ») */
        tl.fromTo(sub1, { opacity: 1, y: 0, filter: "blur(0px)" },
          { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.12, ease: "power2.in", immediateRender: false }, 1.97);

        /* ===================== Scene 2 : par SMS ===================== */
        /* 2.00 : le téléphone monte du bas, ×1,1 flou → net en 0,14 s, devant T7 (échelle 0,9, haut à y 30) */
        gsap.set(phone, { transformOrigin: "50% 0%", scale: 0.99, y: 160, filter: "blur(10px)" });
        tl.fromTo(phone, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: false }, 2.0);
        tl.fromTo(phone, { y: 160, scale: 0.99, filter: "blur(10px)" },
          { y: 0, scale: 0.9, filter: "blur(0px)", duration: 0.14, ease: "expo.out", immediateRender: false }, 2.0);

        /* « par [SMS]. » */
        word(w2[0], 2.13, INK_GRAY, INK);
        boxTrace(box2, 2.4);
        word(w2[1], 2.43, PAPER_GRAY, PAPER, 0.02, 0.1);
        word(w2[2], 2.43, INK_GRAY, INK);

        /* 2.13 : la bulle entrante de Couvert arrive (0,1 s) */
        tl.fromTo(bubIn, { opacity: 0, scale: 0.86, y: 14 },
          { opacity: 1, scale: 1, y: 0, duration: 0.1, ease: "power3.out", immediateRender: false }, 2.13);
        /* 2.43 : sur « SMS », la bulle bleue « OUI » part */
        tl.fromTo(bubOut, { opacity: 0, scale: 0.8, y: 70 },
          { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "power3.out", immediateRender: false }, 2.43);
        /* 2.60 : « Distribué » */
        tl.fromTo(dist, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, 2.6);

        /* 2.70 : l'étiquette de T7, derrière le téléphone, pulse une fois (×1,1 → 1) */
        var tag7 = R.tables[7].tag;
        tl.fromTo(tag7, { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", immediateRender: false }, 2.7);
        tl.fromTo(tag7, { scale: 1.1 }, { scale: 1, duration: 0.16, ease: "power2.inOut", immediateRender: false }, 2.8);

        /* 3.10 à 3.35 : le téléphone suit le filé vers la droite, jusqu'à x 1150 */
        tl.fromTo(phone, { x: 0 }, { x: 400, duration: 0.25, ease: "power2.in", immediateRender: false }, 3.1);

        /* 3.15 à 3.29 : le sous-titre sort */
        tl.fromTo(sub2, { opacity: 1, y: 0, filter: "blur(0px)" },
          { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 3.15);

        render();

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
  </div>
</template>
