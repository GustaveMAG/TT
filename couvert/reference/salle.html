<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Couvert · la salle, référence exécutable</title>
<!--
  Référence exécutable du film « Couvert » (voir frame.md, section world). Source UNIQUE du décor : chaque séquence qui
  montre la salle copie MOT POUR MOT le bloc CSS et le kit JS ci-dessous (entre les marqueurs « début » et « fin »).
  Seul changement autorisé : « ../assets/ » devient « assets/ ». Le kit n'utilise ni id ni GSAP : il construit le monde
  dans un conteneur donné et renvoie des poignées ; la séquence anime ces éléments avec GSAP et place la caméra avec
  salleCam() dans UN onUpdate (caméra = un objet {cx, cy, s, blur} tweené par GSAP).
  Ouvrir ce fichier dans Chromium et appeler demo("soir"), demo("t12"), demo("cuisine"), demo("jour"),
  demo("plein") pour voir les états de référence.
-->
<style>
  @font-face { font-family: "Instrument Sans"; src: url("../assets/fonts/InstrumentSans-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Instrument Sans"; src: url("../assets/fonts/InstrumentSans-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Instrument Sans"; src: url("../assets/fonts/InstrumentSans-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Instrument Sans"; src: url("../assets/fonts/InstrumentSans-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Space Mono"; src: url("../assets/fonts/SpaceMono-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Space Mono"; src: url("../assets/fonts/SpaceMono-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Big Shoulders"; src: url("../assets/fonts/BigShoulders-800.woff2") format("woff2"); font-weight: 800; }
  html, body { margin: 0; background: #100c0a; }
  #frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

  /* ===================== SALLE : début du bloc CSS à copier ===================== */
  .sl-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #15100d; }
  .sl-cam.sl-light { background: #f5efe4; }
  .sl-world { position: absolute; left: 0; top: 0; width: 3200px; height: 2000px; transform-origin: 0 0; }
  .sl-abs { position: absolute; }
  .sl-floor { position: absolute; left: 0; top: 0; width: 3200px; height: 2000px; background:
    repeating-linear-gradient(90deg, rgba(255,235,210,.025) 0 2px, transparent 2px 120px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 3px, transparent 3px 24px), #15100d; }
  .sl-light .sl-floor { background:
    repeating-linear-gradient(90deg, rgba(60,40,20,.06) 0 1px, transparent 1px 80px),
    repeating-linear-gradient(0deg, rgba(60,40,20,.06) 0 1px, transparent 1px 80px), #f5efe4; }
  .sl-kitchen { position: absolute; left: 300px; top: 1480px; width: 2680px; height: 480px; background: repeating-linear-gradient(45deg, #1d1a18 0 30px, #191614 30px 60px); }
  .sl-light .sl-kitchen { background: repeating-linear-gradient(45deg, #e6dccb 0 30px, #e0d5c3 30px 60px); }
  .sl-wall { position: absolute; left: 290px; top: 230px; width: 2700px; height: 1230px; border: 14px solid #2a211b; border-radius: 6px; box-sizing: border-box; }
  .sl-light .sl-wall { border: 6px solid #1c1612; }
  .sl-pass { position: absolute; left: 1050px; top: 1560px; width: 1100px; height: 120px; border-radius: 8px; background: #3a3f42; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .sl-light .sl-pass { background: #cfd2d4; box-shadow: 0 8px 20px rgba(60,40,20,.15); }
  .sl-lamp { position: absolute; top: 1540px; width: 220px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255,150,80,.35), transparent 70%); }
  .sl-light .sl-lamp { display: none; }
  .sl-bin { position: absolute; left: 2700px; top: 1670px; width: 180px; height: 180px; border-radius: 50%; background: #2b2725; box-shadow: inset 0 0 0 14px #3a3532, 0 10px 26px rgba(0,0,0,.45); }
  .sl-light .sl-bin { background: #bdb5aa; box-shadow: inset 0 0 0 14px #a9a196, 0 8px 20px rgba(60,40,20,.15); }
  .sl-board { position: absolute; left: 330px; top: 1530px; width: 360px; height: 400px; border-radius: 8px; background: #3b2f24; }
  .sl-light .sl-board { background: #d6c3a3; }
  .sl-label { position: absolute; width: 200px; margin: -12px 0 0 -100px; text-align: center; font: 400 18px "Space Mono", monospace; letter-spacing: .15em; color: #958a7f; white-space: nowrap; }
  .sl-light .sl-label { color: #5c5348; }
  .sl-dish { position: absolute; width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle, #8a5a3a 0 30%, #5d6b3a 31% 42%, #fbf7f0 43%); box-shadow: 0 6px 14px rgba(0,0,0,.35); margin: -55px 0 0 -55px; }

  .sl-table { position: absolute; }
  .sl-halo { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(240,160,98,.42), rgba(196,83,42,.16) 38%, transparent 68%); }
  .sl-light .sl-halo { display: none; }
  .sl-chair { position: absolute; width: 58px; height: 46px; margin: -23px 0 0 -29px; border-radius: 14px; background: #2e2520; }
  .sl-light .sl-chair { background: #d9cfbf; }
  .sl-guest { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #6d5a4b; box-shadow: 0 6px 12px rgba(0,0,0,.25); opacity: 0; }
  .sl-light .sl-guest { background: #8a7564; }
  .sl-top, .sl-topoff { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 50%; }
  .sl-top { background: #e9dfcf; box-shadow: 0 10px 30px rgba(0,0,0,.55), inset 0 0 0 6px rgba(255,255,255,.35); }
  .sl-topoff { background: rgba(52,45,40,.88); opacity: 0; }
  .sl-sq .sl-top, .sl-sq .sl-topoff { border-radius: 10px; }
  .sl-light .sl-top { background: #fffdf8; box-shadow: 0 8px 24px rgba(60,40,20,.12), inset 0 0 0 2px #ddd2c2; }
  .sl-plate { position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: #fbf7f0; box-shadow: inset 0 0 0 6px #efe6d8; }
  .sl-candle, .sl-wick { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; }
  .sl-wick { background: #6b625b; }
  .sl-candle { background: radial-gradient(circle, #fff 0 25%, #ffd9a0 45%, #f0a062 70%, transparent 72%); box-shadow: 0 0 30px 12px rgba(255,200,130,.55); }
  .sl-light .sl-candle { box-shadow: 0 0 16px 6px rgba(255,190,120,.45); }
  .sl-tent { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; white-space: nowrap; font: 700 15px "Space Mono", monospace; letter-spacing: .12em; color: #2b221c;
    background: #f3eadb; padding: 6px 10px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,.4); opacity: 0; }
  .sl-tag { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: -74px; white-space: nowrap; font: 600 22px "Instrument Sans", sans-serif; color: #fff; background: #c4532a;
    padding: 7px 14px 7px 12px; border-radius: 999px; box-shadow: 0 8px 18px rgba(196,83,42,.35); opacity: 0; }
  .sl-tag.sl-free { background: #fffdf8; color: #9f3f1c; box-shadow: inset 0 0 0 2px #c4532a; }
  .sl-tick { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #c4532a; font-weight: 700; text-align: center; line-height: 22px; font-size: 15px; margin-right: 6px; }
  .sl-tnum { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; font: 400 18px "Space Mono", monospace; letter-spacing: .15em; color: #958a7f; }
  .sl-light .sl-tnum { color: #5c5348; }
  /* ===================== SALLE : fin du bloc CSS à copier ===================== */
</style>
</head>
<body>
<div id="frame"></div>
<script>
/* ===================== SALLE : début du kit JS à copier ===================== */
var SALLE = (function () {
  var T = [
    { id: 1, x: 520, y: 440, k: "r2" }, { id: 2, x: 940, y: 440, k: "s4" }, { id: 3, x: 1360, y: 440, k: "r2" },
    { id: 4, x: 2320, y: 480, k: "s4" }, { id: 5, x: 2740, y: 440, k: "r2" }, { id: 6, x: 520, y: 820, k: "s4" },
    { id: 7, x: 1560, y: 780, k: "rect6" }, { id: 8, x: 2320, y: 900, k: "r2" }, { id: 9, x: 2740, y: 860, k: "s4" },
    { id: 10, x: 520, y: 1200, k: "r2" }, { id: 11, x: 1360, y: 1200, k: "s4" }, { id: 12, x: 940, y: 1180, k: "r4" },
    { id: 13, x: 1960, y: 1220, k: "s4" }, { id: 14, x: 2600, y: 1250, k: "rect6" }
  ];
  var GEO = {
    r2: { w: 150, h: 150, sq: false, chairs: [[0, -108], [0, 108]], plates: [[0, -42], [0, 42]] },
    r4: { w: 200, h: 200, sq: false, chairs: [[0, -132], [0, 132], [-132, 0], [132, 0]], plates: [[0, -60], [0, 60], [-60, 0], [60, 0]] },
    s4: { w: 180, h: 180, sq: true, chairs: [[0, -122], [0, 122], [-122, 0], [122, 0]], plates: [[0, -52], [0, 52], [-52, 0], [52, 0]] },
    rect6: { w: 380, h: 170, sq: true, chairs: [[-125, -117], [0, -117], [125, -117], [-125, 117], [0, 117], [125, 117]],
      plates: [[-125, -46], [0, -46], [125, -46], [-125, 46], [0, 46], [125, 46]] }
  };
  function el(parent, cls, css, html) {
    var d = document.createElement("div"); d.className = cls; if (css) d.style.cssText = css; if (html) d.innerHTML = html;
    parent.appendChild(d); return d;
  }
  // build(container, {light}) : construit la caméra et le monde dans container ; renvoie {cam, world, tables, kitchen}
  // tables[id] = {el, halo, top, topoff, candle, wick, tent, tag, free, guests[], plates[], x, y}
  // État initial : toutes les tables allumées (soir) ou propres (jour), chevalets, étiquettes et convives à opacité 0.
  function build(container, opts) {
    opts = opts || {};
    var cam = el(container, "sl-cam" + (opts.light ? " sl-light" : ""));
    var world = el(cam, "sl-world");
    el(world, "sl-floor"); el(world, "sl-kitchen"); el(world, "sl-wall");
    var pass = el(world, "sl-pass");
    for (var i = 0; i < 4; i++) el(world, "sl-lamp", "left:" + (1150 + i * 270) + "px");
    var bin = el(world, "sl-bin"), board = el(world, "sl-board");
    el(world, "sl-label", "left:1600px;top:1520px", "CUISINE");
    var tables = {};
    T.forEach(function (t) {
      var g = GEO[t.k];
      var d = el(world, "sl-table" + (g.sq ? " sl-sq" : ""), "left:" + (t.x - g.w / 2) + "px;top:" + (t.y - g.h / 2) + "px;width:" + g.w + "px;height:" + g.h + "px");
      var o = { el: d, x: t.x, y: t.y, guests: [], plates: [] };
      o.halo = el(d, "sl-halo");
      g.chairs.forEach(function (c) {
        var rot = Math.abs(c[0]) > Math.abs(c[1]) ? 90 : 0;
        el(d, "sl-chair", "left:" + (g.w / 2 + c[0]) + "px;top:" + (g.h / 2 + c[1]) + "px;transform:rotate(" + rot + "deg)");
        o.guests.push(el(d, "sl-guest", "left:" + (g.w / 2 + c[0] * 1.02) + "px;top:" + (g.h / 2 + c[1] * 1.02) + "px"));
      });
      o.top = el(d, "sl-top");
      g.plates.forEach(function (p) { o.plates.push(el(d, "sl-plate", "left:" + (g.w / 2 + p[0]) + "px;top:" + (g.h / 2 + p[1]) + "px")); });
      o.topoff = el(d, "sl-topoff");
      o.wick = el(d, "sl-wick"); o.candle = el(d, "sl-candle");
      o.tent = el(d, "sl-tent", "top:" + (-20) + "px", "RÉSERVÉ");
      o.tag = el(d, "sl-tag", "", '<span class="sl-tick">✓</span>Confirmé');
      o.free = el(d, "sl-tag sl-free", "", "Libérée");
      el(d, "sl-tnum", "top:" + (g.h + 150) + "px", "T" + t.id);
      tables[t.id] = o;
    });
    return { cam: cam, world: world, tables: tables, kitchen: { pass: pass, bin: bin, board: board } };
  }
  // cam(world, c) : place le point (c.cx, c.cy) du monde au centre du cadre, à l'échelle c.s ; c.dx décale le cadrage (px écran)
  function cam(world, c) {
    world.style.transform = "translate(" + (960 + (c.dx || 0)) + "px,540px) scale(" + c.s + ") translate(" + (-c.cx) + "px," + (-c.cy) + "px)";
    world.style.filter = c.blur ? "blur(" + c.blur + "px)" : "none";
  }
  // toScreen(c, x, y) : position écran d'un point du monde pour la caméra c (utile pour les points du flash et de l'iris)
  function toScreen(c, x, y) { return [960 + (c.dx || 0) + (x - c.cx) * c.s, 540 + (y - c.cy) * c.s]; }
  // off(tb) : état « éteint » posé sans animation (pour les tables déjà éteintes au début d'une séquence)
  function off(tb) { tb.candle.style.opacity = 0; tb.halo.style.opacity = 0; tb.topoff.style.opacity = 1; }
  return { T: T, build: build, cam: cam, toScreen: toScreen, off: off };
})();
/* ===================== SALLE : fin du kit JS à copier ===================== */

function demo(name) {
  var f = document.getElementById("frame"); f.innerHTML = "";
  var light = name === "jour" || name === "plein";
  var w = SALLE.build(f, { light: light });
  var C = { soir: { cx: 1640, cy: 1000, s: 0.5 }, t12: { cx: 940, cy: 1180, s: 2.7 }, cuisine: { cx: 1600, cy: 1610, s: 1.35 },
            jour: { cx: 1640, cy: 1080, s: 0.55 }, plein: { cx: 1640, cy: 1080, s: 0.5 } }[name];
  SALLE.cam(w.world, C);
  for (var id in w.tables) {
    var tb = w.tables[id];
    if (name === "soir") { tb.tent.style.opacity = 1; if (id == 7 || id == 4) SALLE.off(tb); }
    if (name === "jour" || name === "plein") tb.tag.style.opacity = 1;
    if (name === "plein") tb.guests.forEach(function (g) { g.style.opacity = 1; });
  }
}
demo("soir");
</script>
</body>
</html>
